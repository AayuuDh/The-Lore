name: Bug Report
description: Something isn't working as expected.
title: "Bug: "
labels: ["bug", "Needs-Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you include, the faster we can reproduce and fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw — include any error messages or screenshots if helpful.
      placeholder: I clicked "Create Skill" and got a blank screen instead of the editor.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The skill editor should have opened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the issue.
      placeholder: |
        1. Sign in
        2. Go to /home
        3. Click "Create Skill"
        4. …
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / environment
      placeholder: "Chrome 126, macOS 14"
    validations:
      required: false
