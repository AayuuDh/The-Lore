name: Feature Request
description: Suggest a new feature or improvement.
title: "Feature: "
labels: ["feature-request", "Needs-Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make The Lore better? Describe the problem you're trying to solve and what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you felt something was missing or frustrating.
      placeholder: When I'm browsing skills I can't filter by category, so I have to scroll through everything.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see built? Be as specific or as vague as you like.
      placeholder: Add a category filter bar at the top of the Skills page.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways you've thought about solving this (optional).
    validations:
      required: false
