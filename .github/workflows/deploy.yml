# Auto-deploy The Lore to Azure whenever code lands on main.
#
# Two independent jobs run in parallel when their paths change:
#   backend  -> zips matching/ and deploys to the App Service (Python API)
#   frontend -> builds ui/ and uploads it to the Static Web App (React SPA)
#
# Path-based change detection means a pure frontend commit skips the backend
# deploy entirely and vice versa, cutting deploy time roughly in half.
# Both jobs still run on workflow_dispatch (manual trigger) regardless of
# which files changed, with optional per-job on/off toggles.
#
# Auth:
#   backend  uses OIDC (the managed identity 'the-lore-deploy') — no password.
#   frontend uses the Static Web App deploy token (a GitHub secret).

name: Deploy to Azure

# Trigger on every push to main, plus a manual button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy backend
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend
        type: boolean
        default: true

# OIDC needs permission to request a login token; reading the code is enough otherwise.
permissions:
  id-token: write
  contents: read

jobs:
  # -------------- Detect which side(s) actually changed ----------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'matching/**'
            frontend:
              - 'ui/**'

  # ---------------- Backend: Python FastAPI -> App Service ----------------
  backend:
    needs: detect-changes
    # Deploy when matching/ changed on a push, or when manually triggered with
    # deploy_backend enabled (defaults to true).
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Log into Azure as the managed identity via OIDC (passwordless).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Zip the matching/ folder and deploy it. Azure runs pip install itself
      # because SCM_DO_BUILD_DURING_DEPLOYMENT=true is set on the app.
      - name: Deploy backend
        run: |
          cd matching
          zip -rq ../backend.zip . -x "*.pyc" "__pycache__/*"
          az webapp deploy \
            --resource-group rg-aiskills-chelseasimek \
            --name the-lore-api \
            --src-path ../backend.zip \
            --type zip \
            --track-status false

  # ---------------- Frontend: React/Vite -> Static Web Apps ----------------
  frontend:
    needs: detect-changes
    # Deploy when ui/ changed on a push, or when manually triggered with
    # deploy_frontend enabled (defaults to true).
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build the SPA. These VITE_ values get baked into the public browser
      # bundle, so they are NOT secret — keeping them here makes builds reproducible.
      - name: Build frontend
        working-directory: ui
        env:
          VITE_API_BASE_URL: https://the-lore-api-e3dghcgkfnfvcxed.westus-01.azurewebsites.net
          VITE_MSAL_CLIENT_ID: 5368ab3e-6c25-4ea2-951c-84651053f287
          VITE_MSAL_TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
        run: |
          npm ci
          npm run build

      # Upload the already-built dist/ to the Static Web App using its deploy token.
      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ui/dist
          skip_app_build: true
