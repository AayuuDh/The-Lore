# Auto-deploy The Lore to Azure whenever code lands on main.
#
# Two independent jobs run in parallel when their paths change:
#   backend  -> installs Python deps in the runner, then deploys a
#               ready-to-run artifact to the App Service (no server build)
#   frontend -> builds ui/ and uploads it to the Static Web App (React SPA)
#
# Path-based change detection uses a native git-diff step so no third-party
# actions are needed (required for this EMU). A pure frontend commit skips
# the backend deploy and vice versa, cutting deploy time roughly in half.
# Both jobs still run on workflow_dispatch (manual trigger) regardless of
# what changed, with optional per-job on/off toggles.
#
# Actions are pinned to commit SHAs (not mutable tags) per EMU policy.
#
# Auth:
#   backend  uses OIDC (the managed identity 'the-lore-deploy') — no password.
#   frontend uses the Static Web App deploy token (a GitHub secret).

name: Deploy to Azure

# Trigger on every push to main, plus a manual button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy backend
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend
        type: boolean
        default: true

# OIDC needs permission to request a login token; reading the code is enough otherwise.
permissions:
  id-token: write
  contents: read

jobs:
  # -------------- Detect which side(s) actually changed ----------------------
  # Uses git diff between the before/after SHAs from the push event so no
  # third-party action is required. On workflow_dispatch both sides are true.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif echo "$BEFORE" | grep -qE '^0+$'; then
            # All-zeros before SHA means initial push — treat everything as changed.
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            # Workflow file changes validate that both sides still deploy correctly.
            if echo "$CHANGED" | grep -q '^\.github/workflows/'; then
              echo "backend=true"  >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=$(echo  "$CHANGED" | grep -q '^matching/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
              echo "frontend=$(echo "$CHANGED" | grep -q '^ui/'       && echo true || echo false)" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ---------------- Backend: Python FastAPI -> App Service ----------------
  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Log into Azure as the managed identity via OIDC (passwordless).
      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Build-on-deploy: Oryx runs pip install on the App Service box (Linux,
      # PYTHON|3.11) and builds the antenv virtualenv the runtime activates. We
      # keep the flag ON so every deploy rebuilds deps from requirements.txt.
      #
      # Why not build in CI and ship a prebuilt package tree? Tried it — the
      # unpacked deps are ~160MB / thousands of files, and extracting that onto
      # App Service's network-mounted /home (Azure Files) via zip deploy stalls,
      # so the container recycles before the files land. Building on the box
      # sidesteps that entirely. (The Free-tier CPU-quota reason to avoid on-box
      # builds no longer applies — the plan is Basic B1, which has no CPU quota.)
      #
      # Setting the flag to its existing value is a no-op (no restart, no
      # propagation delay); it only matters as self-healing if it was flipped
      # off. If it *was* off, Oryx may skip the build on this same run and the
      # health check below will fail — re-run once the setting has propagated.
      - name: Ensure build-on-deploy config
        run: |
          az webapp config appsettings set \
            --resource-group rg-aiskills-chelseasimek \
            --name the-lore-api \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true
          az webapp config set \
            --resource-group rg-aiskills-chelseasimek \
            --name the-lore-api \
            --startup-file "python -m uvicorn main:app --host 0.0.0.0 --port 8000"

      # Zip the source (WITH requirements.txt) and deploy. Oryx installs the
      # dependencies on the box — no large package tree to extract onto /home.
      # Retries up to 3 times (60 s apart) to survive transient Kudu 504s
      # (cold Kudu restarts can time out the first upload attempt).
      - name: Deploy backend
        run: |
          cd matching
          zip -rq ../backend.zip . -x "*.pyc" "__pycache__/*" ".env"
          for i in 1 2 3; do
            az webapp deploy \
              --resource-group rg-aiskills-chelseasimek \
              --name the-lore-api \
              --src-path ../backend.zip \
              --type zip \
              --track-status false && break
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed — waiting 60 s before retry..."
              sleep 60
            else
              echo "All 3 deployment attempts failed."
              exit 1
            fi
          done

      # Fail the job LOUDLY if the deployed app isn't actually serving. Without
      # this, a broken deploy (missing deps, bad startup) goes green and only
      # surfaces on the next cold start. Polls /docs through the cold-start
      # window (Oryx build + model load can take a couple of minutes).
      - name: Post-deploy health check
        run: |
          url="https://the-lore-api-e3dghcgkfnfvcxed.westus-01.azurewebsites.net/docs"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && echo "Backend healthy." && exit 0
            sleep 10
          done
          echo "::error::Backend did not return HTTP 200 after deploy."
          exit 1

  # ---------------- Frontend: React/Vite -> Static Web Apps ----------------
  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      # Build the SPA. These VITE_ values get baked into the public browser
      # bundle, so they are NOT secret — keeping them here makes builds reproducible.
      - name: Build frontend
        working-directory: ui
        env:
          VITE_API_BASE_URL: https://the-lore-api-e3dghcgkfnfvcxed.westus-01.azurewebsites.net
          VITE_MSAL_CLIENT_ID: 5368ab3e-6c25-4ea2-951c-84651053f287
          VITE_MSAL_TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
          VITE_CLARITY_ID: xq0b5ht68f
        run: |
          npm ci
          npm run build

      # Upload the already-built dist/ to the Static Web App using its deploy token.
      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9  # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ui/dist
          skip_app_build: true
