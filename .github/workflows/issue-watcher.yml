name: Issue Watcher

on:
  issues:
    types: [opened]

permissions:
  issues: write
  models: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Classify the issue
        id: classify
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are an issue triage assistant. Decide whether the issue is a
            small, clearly described change that an automated coding agent
            could fix on its own (for example a specific bug or a concrete UI
            change). Reply with ONLY one word:
            "ai-fix" if it is, or "needs-human" if it is not.
          prompt: |
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

      - name: Apply the ai-fix label
        if: contains(steps.classify.outputs.response, 'ai-fix')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "ai-fix"